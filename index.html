<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf6ea">
<title>ゆるっと近大英語</title>
<style>
:root{
  --bg:#fbf6ea;--grid:rgba(110,150,190,.13);--card:#fffdf8;--line:#eadfc8;
  --ink:#4a4038;--sub:#8a7d70;--accent:#ef8a5b;--accent2:#f6c27a;
  --ok:#5fae84;--okbg:#e9f6ee;--ng:#e0716b;--ngbg:#fdeceb;--blue:#6a9fd4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh;line-height:1.65;font-size:16px;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:640px;margin:0 auto;padding:14px 14px 60px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
h1{font-size:1.35rem;margin:0;letter-spacing:.04em}
h2{font-size:1.15rem;margin:.2em 0 .6em}
h3{font-size:1rem;margin:.2em 0 .4em}
.small{font-size:.85rem;color:var(--sub)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 0 rgba(180,160,120,.18)}
.tape{position:relative}
.tape:before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(246,194,122,.55);transform:rotate(-2deg);border-radius:3px}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pills{display:flex;gap:6px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:38px;font-weight:bold;color:var(--sub)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mascot{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.mascot svg{flex:0 0 74px}
.bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;font-size:.92rem;flex:1}
.bubble:after{content:"";position:absolute;left:-8px;bottom:14px;width:12px;height:12px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.lv{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lv b{font-size:1.5rem;color:var(--accent)}
.title-badge{display:inline-block;background:#fff4e2;border:1px dashed var(--accent2);border-radius:8px;padding:1px 9px;font-size:.88rem}
.bar{height:12px;background:#f1e8d6;border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.75rem;color:var(--sub)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;min-height:84px;text-align:left;box-shadow:0 2px 0 rgba(180,160,120,.2);position:relative}
.mbtn:active{transform:translateY(1px);box-shadow:none}
.mbtn .ic{font-size:1.4rem;display:block}
.mbtn b{display:block}
.mbtn small{color:var(--sub);font-size:.78rem}
.badge{position:absolute;top:8px;right:10px;background:var(--ng);color:#fff;border-radius:99px;font-size:.75rem;padding:0 8px;font-weight:bold}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:13px;min-height:50px;font-weight:bold;background:var(--accent);color:#fff;margin-top:10px;box-shadow:0 3px 0 #d06e42}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d06e42}
.btn.sub{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn.green{background:var(--ok);box-shadow:0 3px 0 #458a65}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>.btn{flex:1}
.back{background:none;border:none;color:var(--sub);padding:8px 4px;min-height:40px}
.seclist .sec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;min-height:64px}
.secno{flex:0 0 46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:1.05rem}
.sec .meta{flex:1}
.sec .meta small{display:block;color:var(--sub);font-size:.8rem}
.acc{font-size:.85rem;color:var(--sub);white-space:nowrap}
.topbar{position:sticky;top:0;z-index:5;background:rgba(251,246,234,.95);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1.5px dashed var(--line);margin:-14px -14px 10px;padding:8px 14px}
.timer{font-weight:bold;font-variant-numeric:tabular-nums;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:3px 10px}
.timer.warn{color:#fff;background:var(--ng);border-color:var(--ng)}
.passage{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif;font-size:1rem;line-height:1.8}
.passage.scroll{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.passage p{margin:.3em 0 .7em}
.passage .pn{display:inline-block;font-family:sans-serif;font-size:.75rem;background:#f1e8d6;border-radius:6px;padding:0 6px;margin-right:6px;color:var(--sub)}
.passage h4{margin:0 0 6px;font-family:sans-serif;font-size:.85rem;color:var(--sub)}
.dl{display:flex;gap:8px;margin:4px 0}
.dl .sp{flex:0 0 auto;font-weight:bold;font-family:sans-serif;font-size:.9rem;color:var(--blue);min-width:4.2em}
.blank{display:inline-block;min-width:2.2em;text-align:center;border-bottom:2px solid var(--sub);font-family:sans-serif;font-size:.85rem;font-weight:bold;color:var(--sub);margin:0 2px;line-height:1.3}
.blank.cur{color:#fff;background:var(--accent);border-color:var(--accent);border-radius:6px 6px 0 0}
.jp{font-family:sans-serif;font-size:.95rem;background:#fff8ec;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-family:sans-serif}
.words span{background:#f5efe2;border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:.92rem}
.qstem{font-weight:bold;margin:4px 0 10px}
.qstem .en{font-family:Georgia,serif;font-weight:normal;font-size:1.05rem;display:block;margin-top:4px}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin:7px 0;min-height:50px;font-family:Georgia,"Hiragino Sans",serif;font-size:1rem}
.choice .lb{flex:0 0 26px;height:26px;border-radius:50%;background:#f1e8d6;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:.85rem;font-weight:bold}
.choice.sel{border-color:var(--blue);background:#eef5fc}
.choice.sel .lb{background:var(--blue);color:#fff}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .lb{background:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ngbg)}
.choice.ng .lb{background:var(--ng);color:#fff}
.choice:disabled{cursor:default;color:inherit}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px}
.fb.ok{background:var(--okbg);border:1.5px solid #bfe2cd}
.fb.ng{background:var(--ngbg);border:1.5px solid #f3c4c1}
.fb b{font-size:1.05rem}
.fb .ans{font-family:Georgia,serif}
.navgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:8px}
.navgrid button{border:1.5px solid var(--line);background:#fff;border-radius:8px;min-height:34px;font-size:.8rem;padding:0}
.navgrid button.done{background:#eef5fc;border-color:var(--blue)}
.navgrid button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.navgrid .gl{grid-column:1/-1;font-size:.75rem;color:var(--sub);margin-top:4px}
.score{font-size:2.6rem;font-weight:bold;color:var(--accent);text-align:center;line-height:1.2}
.score small{font-size:1rem;color:var(--sub)}
table.brk{width:100%;border-collapse:collapse;font-size:.92rem}
table.brk td,table.brk th{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left}
table.brk td.r,table.brk th.r{text-align:right}
.abar{display:flex;align-items:center;gap:8px;margin:9px 0}
.abar .nm{flex:0 0 92px;font-size:.88rem}
.abar .track{flex:1;height:16px;background:#f1e8d6;border-radius:99px;overflow:hidden}
.abar .track i{display:block;height:100%;border-radius:99px}
.abar .pc{flex:0 0 66px;text-align:right;font-size:.85rem;color:var(--sub)}
.rv{border-bottom:1px dashed var(--line);padding:9px 0}
.rv:last-child{border-bottom:none}
.rv .mk{font-weight:bold;margin-right:6px}
.rv .mk.o{color:var(--ok)}.rv .mk.x{color:var(--ng)}
details summary{cursor:pointer;padding:4px 0}
.tag{display:inline-block;font-size:.72rem;border-radius:6px;padding:0 6px;color:#fff;margin-right:4px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;min-height:38px;font-size:.88rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#fff;border:1.5px solid var(--accent2);border-radius:14px;padding:10px 18px;box-shadow:0 4px 14px rgba(120,90,40,.15);opacity:0;transition:all .35s;pointer-events:none;z-index:20;font-weight:bold;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--sub);padding:18px 0}
.foot{text-align:center;font-size:.75rem;color:var(--sub);margin-top:24px}
@media (max-width:380px){.menu{grid-template-columns:1fr}.navgrid{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   ゆるっと近大英語 — 問題バンク（すべてオリジナル）
   ルール: ch[0] が常に正解（表示時にシャッフル）
   ============================================================ */
const BANK = {
/* ---------- 大問I 会話文（3セット×3問） ---------- */
I: [
 {id:"I-1", title:"図書館で", text:
"Student: Excuse me. I'd like to borrow this book, but I left my student ID at home.\nLibrarian: I'm sorry, but ( 1 )\nStudent: Oh, no. My report is due tomorrow morning.\nLibrarian: Well, you can read it here until we close at eight. ( 2 )\nStudent: Really? That would help a lot. Can I copy a few pages, too?\nLibrarian: Sure. The copy machine is next to the entrance. ( 3 )\nStudent: Thanks. I'll make sure to bring my ID next time.",
 qs:[
  {ch:["we can't lend books without it.","you can take as many as you like.","the library is closed on Sundays.","I've never seen this book before."],
   ex:"学生証を忘れた→「それがないと貸し出せない」が自然。直後の「レポートは明日締め切りなのに…」という困った反応にもつながる。it＝student ID。"},
  {ch:["Just leave it on the desk when you're finished.","Nobody is allowed to read books in the library.","I'm afraid someone else has already borrowed it.","You should have returned it last week."],
   ex:"「閉館まで館内で読んでいい」に続くのは「読み終わったら机に置いておいて」。本は今手元にあるので「もう貸し出し中」は矛盾。返却期限の話も無関係。"},
  {ch:["It costs ten yen a page.","It's been broken since last year.","Copying isn't allowed at all.","I don't know where it is."],
   ex:"直前で Sure.（いいですよ）と許可し、場所まで教えているので「1ページ10円です」が自然。「壊れている」「禁止」「場所がわからない」はすべて前の発言と矛盾。"}
 ]},
 {id:"I-2", title:"週末の予定", text:
"Ken: Hey, Mika. Are you free this Saturday? A few of us are going to the aquarium.\nMika: That sounds fun, but ( 1 ) I have to work at the café until three.\nKen: No problem. ( 2 )\nMika: Perfect. Then I can join you after work. Should I bring anything?\nKen: ( 3 ) It's supposed to rain in the afternoon.\nMika: Got it. See you on Saturday!",
 qs:[
  {ch:["I'm not sure I can make it in the morning.","I'm free all day.","I've never wanted to go there.","I don't like going out with you."],
   ex:"but のあとに「3時までバイト」と続くので、「午前中は行けるかわからない」が合う。make it＝都合をつけて行く。「一日中ひま」は but と矛盾。"},
  {ch:["We're actually planning to meet at the station at four.","We'll be leaving at nine, so you can't come.","You should quit that job.","The aquarium closes at noon on Saturdays."],
   ex:"直後にミカが「完璧！じゃあバイトの後に合流できる」と言っているので、3時以降の集合を伝える選択肢が正解。9時出発や正午閉館では合流できない。"},
  {ch:["Just an umbrella, maybe.","Nothing. The weather will be perfect.","You need to buy tickets for everyone.","Bring your swimsuit."],
   ex:"後ろの「午後は雨らしい」が理由になっているのは「傘くらいかな」。天気が完璧だという選択肢は次の文と矛盾する。"}
 ]},
 {id:"I-3", title:"お店で返品", text:
"Clerk: Good afternoon. How can I help you?\nCustomer: I bought this shirt here yesterday, but ( 1 )\nClerk: I see. Would you like to exchange it for a bigger one?\nCustomer: Yes, please. Do you have it in large?\nClerk: Let me check... ( 2 ) We have it in blue, though.\nCustomer: Hmm. Blue isn't really my color. ( 3 )\nClerk: Of course. Just show me the receipt, please.",
 qs:[
  {ch:["it's a little too small for me.","it's too expensive to buy.","my sister loved it so much.","I lost it on the train."],
   ex:"店員が「大きいものと交換しますか」と返しているので「少し小さすぎる」が正解。lost（なくした）なら手元にシャツがないはず。"},
  {ch:["I'm afraid the white ones in that size are sold out.","Here you are. A large white one.","We don't sell shirts here.","You can try it on over there."],
   ex:"直後の though（でも）で「青ならあります」と続くので、「（白の）そのサイズは売り切れ」が自然。I'm afraid ～ は残念なことを伝える丁寧な言い方。"},
  {ch:["Could I just get my money back instead?","I'll take two blue ones, then.","Could you make it smaller?","I'd like to buy another one in medium."],
   ex:"青は好みでない→「代わりに返金してもらえますか」。店員が「レシートを見せて」と言っているのも返金の流れに合う。get one's money back＝返金してもらう。"}
 ]}
],
/* ---------- 大問II 中文空所補充（2題×6問） ---------- */
II: [
 {id:"II-1", title:"10代の睡眠", text:
"Many high school students do not get enough sleep. Experts say that teenagers need about nine hours a night, but most of them sleep ( 1 ) seven hours or even less. One reason is that the body clock of teenagers naturally ( 2 ) later at night, so they do not feel sleepy until around eleven. ( 3 ), school starts early in the morning. As a result, many students go to class feeling tired, which makes it difficult for them to ( 4 ) on their lessons. Some schools in the United States have tried starting classes an hour later. Surprisingly, students at these schools not only slept longer but also got better grades and were ( 5 ) likely to be late. These results suggest that a small change in the school schedule can make a big ( 6 ) to students' health and learning.",
 qs:[
  {ch:["only about","far more than","at least","no less than"],
   ex:"後ろに or even less（あるいはもっと少なく）とあるので「たった7時間ほど」。at least / no less than（少なくとも）は「もっと少なく」と矛盾する。"},
  {ch:["shifts","stays","wakes","falls"],
   ex:"体内時計が「夜遅い方へずれる」→ shift later。だから11時ごろまで眠くならない、という因果につながる。"},
  {ch:["However","Therefore","For example","Similarly"],
   ex:"「夜遅くまで眠くならない」と「学校は朝早く始まる」は対立する内容なので逆接の However。"},
  {ch:["concentrate","insist","agree","object"],
   ex:"concentrate on ～＝～に集中する。insist on（言い張る）、object to（反対する）は意味も前置詞も合わない。"},
  {ch:["less","more","much","very"],
   ex:"良い結果が並んでいるので「遅刻しにくかった」＝ less likely to be late。be likely to ～ に比較の less/more が付く形。"},
  {ch:["difference","mistake","decision","progress"],
   ex:"make a difference (to ～)＝（～に）違いを生む・大きな効果がある。progress は不可算名詞で a big progress とは言えない。"}
 ]},
 {id:"II-2", title:"フードロス", text:
"In Japan, millions of tons of food that could still be eaten are thrown away every year. This problem is called “food loss.” ( 1 ) half of it comes from homes, while the rest comes from restaurants, supermarkets, and factories. One cause is that shops often remove products from their shelves long before the “best-before” date. This date shows when food tastes best, but it does not mean the food becomes dangerous ( 2 ) after that. To reduce waste, some supermarkets now sell such products at lower prices, and a growing number of apps let customers ( 3 ) leftover food from bakeries and restaurants at a discount. At home, we can also take simple steps, ( 4 ) checking the refrigerator before shopping and buying only what we need. If each of us is ( 5 ) careful, the total amount of waste will decrease. After all, food loss is not just someone else's problem; it is something we are all ( 6 ) for.",
 qs:[
  {ch:["Nearly","Most","Almost of","Mostly"],
   ex:"Nearly half ＝ 半分近く。Most half / Almost of half は文法的に不可。almost は of を直接とらない（almost all of ～ ならOK）。"},
  {ch:["immediately","never","ever","yet"],
   ex:"「期限を過ぎてすぐに危険になるわけではない」＝ immediately after that。not と never の二重否定はおかしい。"},
  {ch:["buy","to buy","buying","bought"],
   ex:"使役動詞 let は〈let＋O＋動詞の原形〉。to不定詞にしないのがひっかけポイント。"},
  {ch:["such as","because of","instead of","in spite of"],
   ex:"simple steps（簡単な手段）の具体例を挙げているので such as（～のような）。"},
  {ch:["a little more","much less","not","so"],
   ex:"「一人ひとりがもう少し気をつければ、全体の量は減る」。much less careful（ずっと不注意）では減らない。"},
  {ch:["responsible","proud","famous","absent"],
   ex:"be responsible for ～＝～に責任がある。something we are all responsible for で「みんなが責任を負うもの」。"}
 ]}
],
/* ---------- 大問III 文法・語法（16問） ---------- */
III: [
 {id:"III-1", q:"If I ( ) more time yesterday, I would have finished the report.", ch:["had had","have had","would have","had"],
  ex:"yesterday＝過去の事実に反する仮定 → 仮定法過去完了〈If S had p.p., S would have p.p.〉。have の過去完了なので had had。"},
 {id:"III-2", q:"If she had taken the medicine last night, she ( ) better now.", ch:["would feel","would have felt","felt","will feel"],
  ex:"if節は過去（last night）、主節は現在（now）の混合仮定法。主節は would＋原形。now を見落とさないこと。"},
 {id:"III-3", q:"Never ( ) such a beautiful sunset.", ch:["have I seen","I have seen","I saw","did I saw"],
  ex:"否定語 Never が文頭に出ると倒置が起こり、疑問文の語順になる。did I saw は did の後が過去形なので誤り。"},
 {id:"III-4", q:"Hardly ( ) the station when it began to rain.", ch:["had I reached","I had reached","did I reached","I reached"],
  ex:"Hardly had S p.p. when ～＝SがVするとすぐに～。Hardly が文頭なので倒置して had I reached。"},
 {id:"III-5", q:"( ) comes to the party will be welcome.", ch:["Whoever","Whomever","Whatever","However"],
  ex:"「パーティーに来る人は誰でも」。comes の主語になるので主格の Whoever。Whomever は目的格。"},
 {id:"III-6", q:"( ) hard you try, you can't finish it in a day.", ch:["However","Whatever","Whenever","Wherever"],
  ex:"〈However＋形容詞/副詞＋S V〉＝どんなに～しても。直後に hard（副詞）があるのが目印。"},
 {id:"III-7", q:"( ) from the hill, the town looks like a toy.", ch:["Seen","Seeing","To see","Having seen"],
  ex:"主語 the town は「見られる」側なので受け身の分詞構文 Seen。「町が見る」わけではない点がひっかけ。"},
 {id:"III-8", q:"( ) nothing to do, I went to bed early.", ch:["Having","Had","To have","Have"],
  ex:"分詞構文「することがなかったので」＝ As I had nothing to do。能動なので現在分詞 Having。"},
 {id:"III-9", q:"This bridge is three times ( ) that one.", ch:["as long as","longer as","as longer than","long as"],
  ex:"倍数表現〈X times as ～ as …〉＝…のX倍～。as と than を混ぜた形は誤り。"},
 {id:"III-10", q:"No other student in the class runs ( ) Ken.", ch:["faster than","fastest","as fast","more fast than"],
  ex:"〈No other＋単数名詞＋比較級 than ～〉で最上級の意味（ケンがいちばん速い）。fast の比較級は faster。"},

 {id:"VII-1", title:"Talking to Strangers", text:
"Every morning, millions of people ride crowded trains in silence. Most of them look at their smartphones and avoid eye contact with the people sitting next to them. Many people believe that talking to strangers would be awkward or even annoying. However, recent research in psychology suggests that this belief may be wrong, and that we are missing out on something valuable.\n\nIn one well-known experiment, researchers asked commuters in a large city to do one of three things on their way to work: talk to the person next to them, sit quietly, or do whatever they usually did. Before the experiment, most participants predicted that talking to a stranger would be the least pleasant choice. They worried that the other person would not want to talk, or that they would not know what to say. Surprisingly, the results showed the opposite. People who talked with a stranger reported having the most enjoyable journey, and almost no one was rejected.\n\nWhy do we misjudge these situations so badly? One explanation is that we underestimate how much other people want to connect with us. We tend to assume that others are less interested in us than they really are. Because everyone holds the same assumption, nobody makes the first move, and the silence continues. Researchers describe this as a kind of shared misunderstanding: each person is waiting for someone else to speak first. It is a little like a room full of people who all want to dance but are too shy to be the first one on the floor.\n\nSmall conversations with strangers may also have benefits beyond a pleasant moment. Sociologists point out that our social lives consist not only of “strong ties,” such as family members and close friends, but also of “weak ties,” such as the shop clerk we greet every day or a neighbor we chat with occasionally. These weak ties can give us a sense of belonging to a community. They can also bring us new information, such as job opportunities, that our close friends, who tend to know the same things we do, cannot provide.\n\nOf course, not every situation is suitable for a conversation. Some people need quiet time to rest or to prepare for the day, and it is important to respect that. Still, the next time you are waiting in line or sitting next to someone on a bench, you might try a simple comment about the weather. The other person may be just as glad to talk as you are, and that small exchange could brighten both of your days.",

 {id:"VII-2", title:"A New Way to Support Rural Towns", text:
"Many rural towns in Japan are facing a serious problem: their populations are shrinking and growing older. Young people move to big cities to study or work, and few of them come back. As a result, schools close, local shops disappear, and traditional festivals become difficult to continue. For a long time, the main solution was to encourage people to move permanently to the countryside, but this has proved to be difficult for many families.\n\nIn recent years, a different idea has attracted attention. Instead of counting only the people who live in a town, some local governments now pay attention to people who are involved with the town in various ways. These people may visit regularly, help with events, buy local products online, or work on projects with residents from a distance. This group is sometimes called the “related population,” and it lies somewhere between tourists, who visit only once, and residents, who live there all the time.\n\nOne example comes from a small mountain village that was famous for its rice terraces. Because the farmers were getting too old to take care of the fields, many terraces were abandoned. The village then started a program in which city people could become “owners” of a terrace. For a yearly fee, they visit several times a year to plant and harvest rice with local farmers, and they receive the rice they grow. The program has helped preserve the beautiful landscape, and some participants have become so attached to the village that they eventually moved there.\n\nThe internet has made this kind of involvement much easier. Thanks to video calls, a designer in Tokyo can help a fishing town create labels for its products without leaving her office. Online “hometown tax” donations also allow people to support a place they care about and receive local goods in return. Through these connections, people who have never lived in a town can still feel that they are part of it.\n\nCritics point out that the related population cannot completely replace residents. Someone still has to clear the snow from the roads in winter and take care of elderly neighbors every day. However, supporters argue that the goal is not to replace residents but to give them partners. When people from outside bring new skills and fresh ideas, residents often rediscover the value of their own community. In this sense, the future of rural towns may depend less on how many people live there and more on how many people care about them.",
 qs:[
  {q:"［第1段落］According to the first paragraph, which is a result of population decline in rural towns?", ch:["Traditional festivals become hard to continue.","More schools are built.","Many young people return from big cities.","Local shops become more popular."],

function shuffle(arr, r){ r = r || Math.random; for (let i=arr.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; }

["III","IV","V"].forEach(sec => BANK[sec].forEach(q => addQ({id:q.id, sec, q:q.q, ch:q.ch, ex:q.ex})));
const lc = w => w === "I" ? w : w.toLowerCase();
BANK.VI.forEach(g => {
  const full = (g.pre ? g.pre+" " : "") + g.words.join(" ") + (/^[.?!]/.test(g.post) ? "" : " ") + g.post;
  G[g.id] = {id:g.id, sec:"VI", jp:g.jp, pre:g.pre, post:g.post, words:g.words, pos:g.pos, full, qids:[]};
  SECG.VI.push(g.id);
  g.pos.forEach((p,i) => {
    const correct = g.words[p-1];
    const others = shuffle(g.words.filter(w => w !== correct), rng(hashStr(g.id+p))).slice(0,3);
    addQ({id:g.id+"-"+(i+1), sec:"VI", gid:g.id, n:i, p, q:"", ch:[correct].concat(others).map(lc),
          ex:g.ex+"<br>完成文: <span class='ans'>"+full+"</span>"});
  });
});

/* ============================================================
   プロフィール・保存
   ============================================================ */
let P = localStorage.getItem(STORE+"current") || "kota";
if (PROFILES.indexOf(P) < 0) P = "kota";
let D = load(P);
let S = null;      // 現在のセッション / 画面状態
let VIEW = "home";
let timerId = null;
let showGrid = false;

function blank(){
  const sec = {}; SEC_ORDER.forEach(s => sec[s] = {a:0,c:0});
  return {xp:0, streak:0, lastDay:"", solved:0, correct:0, sec, qs:{}, missed:[], mock:null, mockHist:[]};
}
function load(name){
  try {
    const raw = localStorage.getItem(STORE+name);
    if (!raw) return blank();
    const d = Object.assign(blank(), JSON.parse(raw));
    SEC_ORDER.forEach(s => { if (!d.sec[s]) d.sec[s] = {a:0,c:0}; });
    d.missed = d.missed.filter(id => Q[id]);
    return d;
  } catch(e){ return blank(); }
}
function save(){ try { localStorage.setItem(STORE+P, JSON.stringify(D)); } catch(e){} }
function switchProfile(name){
  if (name === P) return;
  stopTimer(); save();
  P = name; localStorage.setItem(STORE+"current", P);
  D = load(P); S = null; go("home");
  toast(P+" に切りかえたよ");
}

/* ============================================================
   日付・ストリーク・XP
   ============================================================ */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return ymd(new Date()); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return ymd(d); }
function touchDay(){
  const t = todayStr();
  if (D.lastDay === t) return;
  D.streak = (D.lastDay === yesterdayStr()) ? D.streak+1 : 1;
  D.lastDay = t;
}
function curStreak(){ return (D.lastDay === todayStr() || D.lastDay === yesterdayStr()) ? D.streak : 0; }
function levelOf(xp){ let l = 0; LV.forEach((t,i) => { if (xp >= t) l = i; }); return l+1; }
function addXP(n){
  const before = levelOf(D.xp);
  D.xp += n;
  const after = levelOf(D.xp);
  if (after > before) setTimeout(() => toast("Lv."+after+"「"+TITLES[after-1]+"」になったよ 🌱"), 400);
}
function ptsFor(id){ const q = Q[id]; return q.sec === "VII" ? (q.n < 6 ? 3 : 4) : 2; }

function record(id, ok, pts){
  touchDay();
  const q = Q[id];
  const s = D.qs[id] || (D.qs[id] = {a:0,c:0});
  s.a++; if (ok) s.c++;
  D.sec[q.sec].a++; if (ok) D.sec[q.sec].c++;
  D.solved++; if (ok) D.correct++;
  const mi = D.missed.indexOf(id);
  if (ok) { if (mi >= 0) D.missed.splice(mi,1); }
  else if (mi < 0) D.missed.push(id);
  let xp = 0;
  if (ok) { xp = pts*5; addXP(xp); }
  save();
  return xp;
}

/* ============================================================
   出題の組み立て
   ============================================================ */
function qAtt(id){ return (D.qs[id]||{}).a || 0; }
function gAtt(gid){ return G[gid].qids.reduce((s,q) => s+qAtt(q), 0); }
function pickGroups(sec, k, byAtt){
  const gs = shuffle(SECG[sec].slice());
  if (byAtt) gs.sort((a,b) => gAtt(a)-gAtt(b));
  return gs.slice(0,k);
}
function pickQs(sec, k, byAtt){
  const qs = shuffle(SECQ[sec].slice());
  if (byAtt) qs.sort((a,b) => qAtt(a)-qAtt(b));
  return qs.slice(0,k);
}
function groupQids(gids){ return gids.reduce((a,g) => a.concat(G[g].qids), []); }
function newSeed(){ return Math.floor(Math.random()*1e9); }

function startPractice(sec){
  const pl = PRACTICE[sec];
  const qids = pl.g ? groupQids(pickGroups(sec, pl.g, true)) : pickQs(sec, pl.n, true);
  S = {mode:"practice", sec, qids, i:0, ans:{}, seed:newSeed(), gained:0};
  go("quiz");
}
function startReview(sec){
  let list = D.missed.filter(id => !sec || Q[id].sec === sec);
  list.sort((a,b) => SEC_ORDER.indexOf(Q[a].sec)-SEC_ORDER.indexOf(Q[b].sec) || a.localeCompare(b, "en", {numeric:true}));
  list = list.slice(0,10);
  if (!list.length) return;
  S = {mode:"review", sec:sec||null, qids:list, i:0, ans:{}, seed:newSeed(), gained:0};
  go("quiz");
}
function buildMock(){
  let qids = [];
  qids = qids.concat(groupQids(pickGroups("I",2)));
  qids = qids.concat(groupQids(pickGroups("II",1)));
  ["III","IV","V"].forEach(s => {
    const picked = pickQs(s, SEC[s].mock);
    picked.sort((a,b) => SECQ[s].indexOf(a)-SECQ[s].indexOf(b));
    qids = qids.concat(picked);
  });
  qids = qids.concat(groupQids(pickGroups("VI",4)));
  qids = qids.concat(groupQids(pickGroups("VII",1)));
  return qids;
}
function startMock(){
  if (D.mock && !confirm("途中の模試があります。破棄して新しく始めますか？")) return;
  D.mock = {qids:buildMock(), ans:{}, start:Date.now(), seed:newSeed(), i:0};
  save();
  S = {mode:"mock"}; showGrid = false;
  go("mock");
}
function resumeMock(){ S = {mode:"mock"}; showGrid = false; go("mock"); }

/* ============================================================
   描画ヘルパー
   ============================================================ */
const $app = document.getElementById("app");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function pct(c,a){ return a ? Math.round(c/a*100) : 0; }
function secTag(s){ return "<span class='tag' style='background:"+SEC[s].color+"'>"+s+"</span>"; }
function blanks(html, cur){
  return html.replace(/\(\s?(\d)\s?\)/g, (m,n) => "<span class='blank"+(cur && +n===cur ? " cur" : "")+"'>"+n+"</span>");
}
function choiceOrder(id, seed){ return shuffle([0,1,2,3], rng(hashStr(id+":"+seed))); }

function groupHTML(gid, curN, scroll){
  const g = G[gid];
  if (g.sec === "I") {
    const rows = g.text.split("\n").map(l => {
      const k = l.indexOf(":");
      return "<div class='dl'><span class='sp'>"+esc(l.slice(0,k))+"</span><span>"+blanks(esc(l.slice(k+1)), curN)+"</span></div>";
    }).join("");
    return "<div class='passage'><h4>会話：「"+esc(g.title)+"」</h4>"+rows+"</div>";
  }
  if (g.sec === "II") {
    return "<div class='passage'><h4>"+esc(g.title)+"</h4><p>"+blanks(esc(g.text), curN)+"</p></div>";
  }
  if (g.sec === "VII") {
    const ps = g.text.split("\n\n").map((p,i) => "<p><span class='pn'>"+(i+1)+"</span>"+esc(p)+"</p>").join("");
    return "<div class='passage"+(scroll ? " scroll" : "")+"'><h4>"+esc(g.title)+"</h4>"+ps+"</div>";
  }
  if (g.sec === "VI") {
    let bl = g.words.map((w,i) => "<span class='blank"+(curN===i+1 ? " cur" : "")+"'>"+(i+1)+"</span>").join(" ");
    const sent = (g.pre ? esc(g.pre)+" " : "") + bl + (/^[.?!]/.test(g.post) ? "" : " ") + esc(g.post);
    const ws = shuffle(g.words.slice(), rng(hashStr(g.id+"bank"))).map(w => "<span>"+esc(lc(w))+"</span>").join("");
    return "<div class='passage'><div class='jp'>"+esc(g.jp)+"</div><div>"+sent+"</div><div class='words'>"+ws+"</div>"+
      "<div class='small' style='margin-top:6px;font-family:sans-serif'>※文頭に来る語も小文字で示しています。各語は1回ずつ使います。</div></div>";
  }
  return "";
}
function stemHTML(q){
  if (q.sec === "I" || q.sec === "II") return "空所 <span class='blank cur'>"+(q.n+1)+"</span> に入れるのに最も適切なものを選びなさい。";
  if (q.sec === "III") return "空所に入れるのに最も適切なものを選びなさい。<span class='en'>"+esc(q.q).replace(/\(\s*\)/g,"<span class='blank'>　</span>")+"</span>";
  if (q.sec === "IV") return "次の文とほぼ同じ意味の文を選びなさい。<span class='en'>"+esc(q.q)+"</span>";
  if (q.sec === "V") return "次の定義に合う語を選びなさい。<span class='en'>“"+esc(q.q)+"”</span>";
  if (q.sec === "VI") return "日本文の意味になるように並べかえたとき、<span class='blank cur'>"+q.p+"</span> 番目に来る語は？";
  if (q.sec === "VII") return esc(q.q);
  return "";
}
function curBlank(q){ return (q.sec==="I"||q.sec==="II") ? q.n+1 : (q.sec==="VI" ? q.p : 0); }

function mascotSVG(){

/* ============================================================

function go(v){ VIEW = v; render(); window.scrollTo(0,0); }
function render(){
  if (VIEW !== "mock") stopTimer();
  const f = {home:vHome, select:vSelect, quiz:vQuiz, result:vResult, mockIntro:vMockIntro, mock:vMock, mockResult:vMockResult, analysis:vAnalysis, review:vReview}[VIEW] || vHome;

function recommend(){
  const tried = SEC_ORDER.filter(s => D.sec[s].a >= 3);
  const untried = SEC_ORDER.filter(s => D.sec[s].a === 0);
  if (tried.length) {
    tried.sort((a,b) => pct(D.sec[a].c,D.sec[a].a)-pct(D.sec[b].c,D.sec[b].a));
    const s = tried[0], p = pct(D.sec[s].c, D.sec[s].a);
    if (p < 80 || !untried.length) return {s, why:"正答率 "+p+"%。いちばん伸びしろがある大問だよ。"};
  }
  if (untried.length) return {s:untried[0], why:"まだ解いていない大問。まずは1セットだけ。"};
  return {s:"VI", why:"配点の大きい語句整序で得点を固めよう。"};
}

    "<button class='mbtn' onclick=\"go('analysis')\"><span class='ic'>📊</span><b>苦手分析</b><small>大問別の正答率</small></button>"+

function vSelect(){
  const list = SEC_ORDER.map(s => {
    const st = D.sec[s];
    const pl = PRACTICE[s];
    const size = pl.g ? (s==="VI" ? pl.g+"文（"+pl.g*2+"マーク）" : "1題（"+G[SECG[s][0]].qids.length+"問）") : pl.n+"問";
    return "<button class='sec' onclick=\"startPractice('"+s+"')\"><span class='secno' style='background:"+SEC[s].color+"'>"+s+"</span>"+
      "<span class='meta'><b>"+SEC[s].name+"</b><small>"+SEC[s].desc+" · 1回 "+size+"</small></span>"+

  }).join("");

}

function vQuiz(){
  const id = S.qids[S.i], q = Q[id];
  const done = S.ans[id] !== undefined;
  const order = choiceOrder(id, S.seed);
  const label = S.mode === "review" ? "🔁 復習" : "大問"+q.sec+" "+SEC[q.sec].name;
  let html = "<div class='topbar'><button class='back' onclick='quitQuiz()'>✕ やめる</button><span>"+label+"</span><span class='small'>"+(S.i+1)+" / "+S.qids.length+"</span></div>";
  if (S.mode === "review") html += "<div>"+secTag(q.sec)+"<span class='small'>大問"+q.sec+" "+SEC[q.sec].name+"</span></div>";
  if (q.gid) html += groupHTML(q.gid, curBlank(q), true);
  html += "<div class='card'><div class='qstem'>"+stemHTML(q)+"</div>";
  order.forEach((o,k) => {
    let cls = "choice";
    if (done) { if (o === 0) cls += " ok"; else if (S.ans[id] === o) cls += " ng"; }
    html += "<button class='"+cls+"' "+(done ? "disabled" : "onclick='answer("+o+")'")+"><span class='lb'>"+(k+1)+"</span><span>"+esc(q.ch[o])+"</span></button>";
  });
  if (done) {
    const ok = S.ans[id] === 0;
    html += "<div class='fb "+(ok ? "ok" : "ng")+"'><b>"+(ok ? "⭕ 正解！" : "❌ おしい！")+"</b>"+(ok ? " <span class='small'>+"+ptsFor(id)*5+" XP</span>" : "")+
      "<div>正解: <span class='ans'>"+esc(q.ch[0])+"</span></div><div style='margin-top:4px'>"+q.ex+"</div></div>";
    html += "<button class='btn' onclick='nextQ()'>"+(S.i+1 < S.qids.length ? "次へ →" : "結果を見る")+"</button>";
  }
  html += "</div>";
  return html;
}
function answer(o){
  const id = S.qids[S.i];
  if (S.ans[id] !== undefined) return;
  S.ans[id] = o;
  S.gained += record(id, o === 0, ptsFor(id));
  render();
  const fb = document.querySelector(".fb");
  if (fb) fb.scrollIntoView({behavior:"smooth", block:"center"});
}
function nextQ(){ if (S.i+1 < S.qids.length) { S.i++; go("quiz"); } else go("result"); }
function quitQuiz(){
  const n = Object.keys(S.ans).length;
  if (n === 0) { go("home"); return; }
  go("result");
}

function vResult(){
  const answered = S.qids.filter(id => S.ans[id] !== undefined);
  const ok = answered.filter(id => S.ans[id] === 0).length;
  const rows = answered.map(id => {
    const q = Q[id], c = S.ans[id] === 0;
    return "<div class='rv'><span class='mk "+(c?"o":"x")+"'>"+(c?"○":"×")+"</span>"+secTag(q.sec)+
      "<span class='small'>"+esc(shortLabel(q))+"</span><div class='small'>正解: "+esc(q.ch[0])+"</div></div>";
  }).join("");
  const again = S.mode === "practice"
    ? "<button class='btn' onclick=\"startPractice('"+S.sec+"')\">もう1セット（大問"+S.sec+"）</button>"
    : (D.missed.length ? "<button class='btn' onclick='startReview()'>つづけて復習する</button>" : "");
  const msg = !answered.length ? "" : (ok === answered.length ? "全問正解！すごい〜🎉" : ok/answered.length >= .6 ? "いい感じ！この調子。" : "まちがえた所は復習リストに入れておいたよ。");
  return "<h2>📝 おつかれさま！</h2><div class='card tape'><div class='score'>"+ok+"<small> / "+answered.length+" 問正解</small></div>"+
    "<div style='text-align:center' class='small'>獲得 "+S.gained+" XP · "+msg+"</div></div>"+
    "<div class='card'>"+rows+"</div>"+again+
    "<div class='row'><button class='btn sub' onclick=\"go('select')\">大問をえらぶ</button><button class='btn sub' onclick=\"go('home')\">ホームへ</button></div>";
}
function shortLabel(q){
  if (q.sec==="I"||q.sec==="II") return G[q.gid].title+" 空所"+(q.n+1);
  if (q.sec==="VI") return G[q.gid].jp.slice(0,14)+"…（"+q.p+"番目）";
  if (q.sec==="VII") return G[q.gid].title+" 問"+(q.n+1);
  return q.q.length > 40 ? q.q.slice(0,40)+"…" : q.q;
}

/* ---------- 模試 ---------- */
function vMockIntro(){
  const rows = SEC_ORDER.map((s,i) => {
    const start = SEC_ORDER.slice(0,i).reduce((a,t) => a+SEC[t].mock, 0)+1, end = start+SEC[s].mock-1;
    let pts = 0; for (let m=start;m<=end;m++) pts += markPts(m);
    return "<tr><td>"+secTag(s)+SEC[s].name+"</td><td class='r'>"+start+"–"+end+"</td><td class='r'>"+pts+"点</td></tr>";
  }).join("");
  const hist = D.mockHist.slice(-5).reverse().map(h => "<div class='small'>"+h.date+"　<b>"+h.score+"</b> / 100</div>").join("");
  return "<button class='back' onclick=\"go('home')\">← もどる</button><h2>⏱ 通し模試</h2>"+
    "<div class='card'>本番と同じ <b>45マーク・60分・100点満点</b>。<br>マーク1〜37は各2点、38〜43は各3点、44・45は各4点。<br>途中で閉じても続きから再開できます（タイマーは進みます）。"+
    "<table class='brk' style='margin-top:8px'><tr><th>大問</th><th class='r'>マーク</th><th class='r'>配点</th></tr>"+rows+"</table></div>"+
    (hist ? "<div class='card'><h3>最近の模試</h3>"+hist+"</div>" : "")+
    (D.mock ? "<button class='btn green' onclick='resumeMock()'>途中の模試をつづける</button>" : "")+
    "<button class='btn' onclick='startMock()'>"+(D.mock ? "新しく始める" : "スタート！")+"</button>";
}
function mockRemain(){ return Math.max(0, MOCK_SEC - Math.floor((Date.now()-D.mock.start)/1000)); }
function fmtTime(s){ return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function startTimer(){
  stopTimer();
  const tick = () => {
    if (!D.mock) { stopTimer(); return; }
    const r = mockRemain();
    const el = document.getElementById("timer");
    if (el) { el.textContent = "⏱ "+fmtTime(r); el.className = "timer"+(r <= 300 ? " warn" : ""); }
    if (r <= 0) { stopTimer(); toast("時間です！採点するね"); finishMock(); }
  };
  tick();
  timerId = setInterval(tick, 1000);
}
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }

function vMock(){
  if (!D.mock) return vHome();
  const M = D.mock, i = M.i, id = M.qids[i], q = Q[id];
  const order = choiceOrder(id, M.seed);
  const answered = Object.keys(M.ans).length;
  let html = "<div class='topbar'><button class='back' onclick=\"go('home')\">⏸ 中断</button><span id='timer' class='timer'>⏱ "+fmtTime(mockRemain())+"</span><span class='small'>回答 "+answered+"/45</span></div>";
  html += "<div>"+secTag(q.sec)+"<b>マーク "+(i+1)+"</b> <span class='small'>（大問"+q.sec+" "+SEC[q.sec].name+" · "+markPts(i+1)+"点）</span></div>";
  if (q.gid) html += groupHTML(q.gid, curBlank(q), true);
  html += "<div class='card'><div class='qstem'>"+stemHTML(q)+"</div>";
  order.forEach((o,k) => {
    html += "<button class='choice"+(M.ans[id] === o ? " sel" : "")+"' onclick='mockAnswer("+o+")'><span class='lb'>"+(k+1)+"</span><span>"+esc(q.ch[o])+"</span></button>";
  });
  html += "<div class='row'><button class='btn sub' onclick='mockGo("+(i-1)+")' "+(i===0?"disabled":"")+">← 前へ</button>"+
          "<button class='btn sub' onclick='mockGo("+(i+1)+")' "+(i===44?"disabled":"")+">次へ →</button></div></div>";
  html += "<button class='btn sub' onclick='toggleGrid()'>"+(showGrid ? "マーク一覧をとじる" : "📋 マーク一覧をひらく")+"</button>";
  if (showGrid) {
    let grid = "", last = "";
    M.qids.forEach((qid,k) => {
      const s = Q[qid].sec;
      if (s !== last) { grid += "<div class='gl'>大問"+s+" "+SEC[s].name+"</div>"; last = s; }
      grid += "<button class='"+(k===i ? "cur" : (M.ans[qid] !== undefined ? "done" : ""))+"' onclick='mockGo("+k+")'>"+(k+1)+"</button>";
    });
    html += "<div class='card'><div class='navgrid'>"+grid+"</div></div>";
  }
  html += "<button class='btn green' onclick='submitMock()'>提出して採点する</button>";
  return html;
}
function mockAnswer(o){ const M = D.mock, id = M.qids[M.i]; M.ans[id] = o; save(); render(); }
function mockGo(k){ if (k < 0 || k > 44) return; D.mock.i = k; save(); render(); window.scrollTo(0,0); }
function toggleGrid(){ showGrid = !showGrid; render(); }
function submitMock(){
  const left = 45 - Object.keys(D.mock.ans).length;
  if (!confirm(left ? "未回答が "+left+" 問あります。提出しますか？" : "提出して採点しますか？")) return;
  finishMock();
}
function finishMock(){
  stopTimer();
  const M = D.mock; if (!M) return;
  const bySec = {}; SEC_ORDER.forEach(s => bySec[s] = {got:0, max:0, ok:0, n:0});
  let score = 0, gained = 0;
  M.qids.forEach((id,k) => {
    const pts = markPts(k+1), q = Q[id], ok = M.ans[id] === 0;
    bySec[q.sec].max += pts; bySec[q.sec].n++;
    if (ok) { score += pts; bySec[q.sec].got += pts; bySec[q.sec].ok++; }
    gained += record(id, ok, pts);
  });
  const used = Math.min(MOCK_SEC, Math.floor((Date.now()-M.start)/1000));
  addXP(30); gained += 30;
  D.mockHist.push({date:todayStr(), score});
  if (D.mockHist.length > 30) D.mockHist.shift();
  S = {mode:"mockResult", qids:M.qids, ans:M.ans, seed:M.seed, score, bySec, gained, used};
  D.mock = null; save();
  go("mockResult");
}
function vMockResult(){
  const R = S;
  const rows = SEC_ORDER.map(s => {
    const b = R.bySec[s];
    return "<tr><td>"+secTag(s)+SEC[s].name+"</td><td class='r'>"+b.ok+"/"+b.n+"</td><td class='r'><b>"+b.got+"</b> / "+b.max+"</td></tr>";
  }).join("");
  const list = R.qids.map((id,k) => {
    const q = Q[id], ok = R.ans[id] === 0, a = R.ans[id];
    return "<details class='rv'><summary><span class='mk "+(ok?"o":"x")+"'>"+(ok?"○":"×")+"</span>マーク"+(k+1)+" "+secTag(q.sec)+"<span class='small'>"+esc(shortLabel(q))+"</span></summary>"+
      "<div class='small'>あなたの答え: "+(a === undefined ? "未回答" : esc(q.ch[a]))+"</div><div>正解: <b>"+esc(q.ch[0])+"</b></div><div class='small'>"+q.ex+"</div></details>";
  }).join("");
  const comment = R.score >= 80 ? "合格圏の手ごたえ！この感覚をキープ。" : R.score >= 60 ? "あと少し！配点の大きいVI・VIIを固めよう。" : "まずは大問別練習で形式に慣れていこ〜。";
  return "<h2>🎓 模試の結果</h2><div class='card tape'><div class='score'>"+R.score+"<small> / 100 点</small></div>"+
    "<div class='small' style='text-align:center'>所要時間 "+fmtTime(R.used)+" · 獲得 "+R.gained+" XP</div><div style='text-align:center;margin-top:6px'>"+comment+"</div></div>"+
    "<div class='card'><h3>大問別の得点</h3><table class='brk'><tr><th>大問</th><th class='r'>正解</th><th class='r'>得点</th></tr>"+rows+"</table></div>"+
    "<div class='card'><h3>答えあわせ</h3><div class='small'>タップで解説がひらきます。</div>"+list+"</div>"+
    "<div class='row'><button class='btn sub' onclick=\"go('analysis')\">苦手分析へ</button><button class='btn sub' onclick=\"go('home')\">ホームへ</button></div>";
}

/* ---------- 分析・復習 ---------- */
function vAnalysis(){
  const bars = SEC_ORDER.map(s => {
    const st = D.sec[s], p = pct(st.c, st.a);
    const col = !st.a ? "#ddd" : p >= 80 ? "var(--ok)" : p >= 60 ? "var(--accent2)" : "var(--ng)";
    return "<div class='abar'><span class='nm'>"+secTag(s)+SEC[s].name+"</span><span class='track'><i style='width:"+(st.a ? Math.max(p,3) : 0)+"%;background:"+col+"'></i></span>"+
      "<span class='pc'>"+(st.a ? p+"% <span style='font-size:.72rem'>("+st.c+"/"+st.a+")</span>" : "未挑戦")+"</span></div>";
  }).join("");
  const rec = recommend();
  const hist = D.mockHist.slice(-8);
  const histHTML = hist.length ? hist.map(h => "<div class='abar'><span class='nm small'>"+h.date.slice(5)+"</span><span class='track'><i style='width:"+Math.max(h.score,2)+"%;background:var(--blue)'></i></span><span class='pc'>"+h.score+"点</span></div>").join("")
    : "<div class='empty'>まだ模試の記録はありません</div>";
  return "<button class='back' onclick=\"go('home')\">← もどる</button><h2>📊 苦手分析</h2>"+
    "<div class='card'><h3>大問別 累計正答率</h3>"+bars+"<div class='small'>緑 80%以上 · 黄 60%以上 · 赤 60%未満</div></div>"+
    "<div class='card'><h3>🌼 今日のおすすめ</h3><div>"+secTag(rec.s)+"<b>大問"+rec.s+" "+SEC[rec.s].name+"</b></div><div class='small'>"+rec.why+"</div>"+
      "<button class='btn' onclick=\"startPractice('"+rec.s+"')\">練習する</button></div>"+
    "<div class='card'><h3>模試の得点の推移</h3>"+histHTML+"</div>";
}
function vReview(){
  if (!D.missed.length) return "<button class='back' onclick=\"go('home')\">← もどる</button><h2>🔁 復習リスト</h2><div class='card empty'>まちがえた問題はありません 🌸<br>練習や模試でまちがえると、ここにたまります。</div>";
  const counts = {}; D.missed.forEach(id => { const s = Q[id].sec; counts[s] = (counts[s]||0)+1; });
  const chips = SEC_ORDER.filter(s => counts[s]).map(s => "<button onclick=\"startReview('"+s+"')\">"+secTag(s)+SEC[s].name+" "+counts[s]+"</button>").join("");
  const rows = D.missed.slice().sort((a,b) => SEC_ORDER.indexOf(Q[a].sec)-SEC_ORDER.indexOf(Q[b].sec)).map(id => {
    const q = Q[id];
    return "<div class='rv'>"+secTag(q.sec)+"<span class='small'>"+esc(shortLabel(q))+"</span></div>";
  }).join("");
  return "<button class='back' onclick=\"go('home')\">← もどる</button><h2>🔁 復習リスト</h2>"+
    "<div class='card'><b>"+D.missed.length+"問</b> たまっています。正解するとリストから消えます。"+
    "<button class='btn' onclick='startReview()'>まとめて解き直す（最大10問）</button><div class='small' style='margin-top:8px'>大問ごとに解き直す：</div><div class='chips'>"+chips+"</div></div>"+
    "<div class='card'>"+rows+"</div>";
}

/* ---------- トースト ---------- */
let toastId = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastId); toastId = setTimeout(() => t.classList.remove("show"), 2600);
}

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
render();
</script>
